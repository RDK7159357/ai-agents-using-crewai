name: Daily AI Briefer

on:
  schedule:
    # Run daily at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - interview
      company:
        description: 'Company name (for interview mode)'
        required: false
        type: string
      chat_id:
        description: 'Telegram Chat ID (who triggered this)'
        required: false
        type: string

jobs:
  briefer:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify critical imports
      run: |
        python -c "import litellm; print('✅ litellm imported successfully')"
        python -c "from crewai import LLM; print('✅ crewai LLM imported successfully')"

    - name: Run Daily Brief
      if: github.event.inputs.mode == 'daily' || github.event_name == 'schedule'
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        PREFERRED_MODEL: ${{ secrets.PREFERRED_MODEL }}
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        OLLAMA_API_URL: ${{ secrets.OLLAMA_API_URL }}
        OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
      run: python main.py

    - name: Run Interview Prep
      if: github.event.inputs.mode == 'interview'
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        PREFERRED_MODEL: ${{ secrets.PREFERRED_MODEL }}
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        OLLAMA_API_URL: ${{ secrets.OLLAMA_API_URL }}
        OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
      run: python main.py interview "${{ github.event.inputs.company }}"
